name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # The WPF host targets net10.0-windows, so the whole solution builds on Windows.
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ContextMessenger.slnx

      - name: Build
        run: dotnet build ContextMessenger.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ContextMessenger.slnx --configuration Release --no-build --verbosity normal